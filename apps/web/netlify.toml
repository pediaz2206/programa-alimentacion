# El sitio desplegable es apps/web: la PWA mas las funciones que la sirven.
#
# OJO con las rutas: Netlify lee este archivo desde el paquete elegido
# (packagePath), pero resuelve `publish` y `functions` contra la RAIZ del
# repositorio, porque `base` sigue siendo la raiz. Por eso van con el prefijo
# apps/web y no relativas a este archivo. El comando, en cambio, corre desde la
# raiz y usa el workspace.
[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "apps/web/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# La PWA es una SPA: todas las rutas sirven el mismo index.html. Las funciones
# quedan afuera del catch-all, si no nunca se alcanzarian.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
