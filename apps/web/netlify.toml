# El sitio desplegable es apps/web: la PWA mas las funciones que la sirven.
# Netlify detecta el monorepo y pide elegir un paquete; al elegir @pa/web lee
# este archivo, y las rutas de abajo son relativas a este directorio.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# La PWA es una SPA: todas las rutas sirven el mismo index.html. Las funciones
# quedan afuera del catch-all, si no nunca se alcanzarian.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
